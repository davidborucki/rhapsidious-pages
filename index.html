<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Voxxly is a home for sharp, shareable podcast soundbites and personalized recommendations."
    />
    <meta name="theme-color" content="#07070d" />
    <title>Voxxly · Soundbites worth hearing</title>
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/voxxly-logo-192.png?v=20260714-4" />
    <link rel="apple-touch-icon" href="./assets/voxxly-logo-192.png?v=20260714-4" />
    <link rel="stylesheet" href="./styles.css?v=20260724-10" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a id="brandLink" class="brand" href="#/login" aria-label="Voxxly login">
          <img class="brand-mark" src="./assets/voxxly-logo-192.png" alt="" />
          <span class="brand-wordmark">voxxly</span>
        </a>

        <div class="header-actions">
          <nav id="guestNav" class="guest-nav" aria-label="Account navigation">
            <a class="text-link" href="#/login">Sign in</a>
            <a class="compact-button" href="#/signup">Create account</a>
          </nav>
          <a id="accountLink" class="account-link hidden" href="#/profile" aria-label="Open your profile"></a>
          <button id="logoutButton" class="icon-button hidden" type="button">Log out</button>
        </div>
      </div>
    </header>

    <nav id="primaryNav" class="primary-nav hidden" aria-label="Primary navigation">
      <a class="nav-link" data-route="#/feed" href="#/feed">
        <span class="nav-icon nav-icon-audio-lines" aria-hidden="true"></span>
        <span>Soundbytes</span>
      </a>
      <a class="nav-link" data-route="#/search" href="#/search">
        <span class="nav-icon nav-icon-search" aria-hidden="true"></span>
        <span>Search</span>
      </a>
      <a class="nav-link" data-route="#/saved" href="#/saved">
        <span class="nav-icon nav-icon-bookmark" aria-hidden="true"></span>
        <span>Saved</span>
      </a>
      <a class="nav-link" data-route="#/upload" href="#/upload">
        <span class="nav-icon nav-icon-ticket-plus" aria-hidden="true"></span>
        <span>Upload</span>
      </a>
      <a class="nav-link" data-route="#/profile" href="#/profile">
        <span class="nav-icon nav-icon-user" aria-hidden="true"></span>
        <span>Profile</span>
      </a>
    </nav>

    <main id="app" class="app-shell" tabindex="-1"></main>
    <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>

    <script src="./config.js?v=20260714-4"></script>
    <script src="./app.js?v=20260724-10"></script>
  </body>
</html>
