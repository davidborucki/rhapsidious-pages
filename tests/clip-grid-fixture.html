<!DOCTYPE html>
<html class="signed-in" lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxxly clip-grid responsive fixture</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
      .fixture-heading { margin: 0 0 24px; }
      .fixture-heading p { margin: 8px 0 0; color: var(--muted); }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <section class="page-wrap">
        <header class="fixture-heading">
          <h1>Clip grid test</h1>
          <p>Three columns normally; four when the content container reaches 1060px.</p>
        </header>
        <div class="clip-grid-shell">
          <div class="clip-grid" data-test-grid>
            <article class="profile-clip"><a class="clip-thumbnail-link" href="#clip-1" aria-label="Play clip one"><span class="clip-thumbnail-placeholder"><span>1</span></span></a><div class="profile-clip-copy"><h3>Clip one</h3></div></article>
            <article class="profile-clip"><a class="clip-thumbnail-link" href="#clip-2" aria-label="Play clip two"><span class="clip-thumbnail-placeholder"><span>2</span></span></a><div class="profile-clip-copy"><h3>Clip two</h3></div></article>
            <article class="profile-clip"><a class="clip-thumbnail-link" href="#clip-3" aria-label="Play clip three"><span class="clip-thumbnail-placeholder"><span>3</span></span></a><div class="profile-clip-copy"><h3>Clip three</h3></div></article>
            <article class="profile-clip"><a class="clip-thumbnail-link" href="#clip-4" aria-label="Play clip four"><span class="clip-thumbnail-placeholder"><span>4</span></span></a><div class="profile-clip-copy"><h3>Clip four</h3></div></article>
            <article class="profile-clip"><a class="clip-thumbnail-link" href="#clip-5" aria-label="Play clip five"><span class="clip-thumbnail-placeholder"><span>5</span></span></a><div class="profile-clip-copy"><h3>Clip five</h3></div></article>
            <article class="profile-clip"><a class="clip-thumbnail-link" href="#clip-6" aria-label="Play clip six"><span class="clip-thumbnail-placeholder"><span>6</span></span></a><div class="profile-clip-copy"><h3>Clip six</h3></div></article>
            <article class="profile-clip"><a class="clip-thumbnail-link" href="#clip-7" aria-label="Play clip seven"><span class="clip-thumbnail-placeholder"><span>7</span></span></a><div class="profile-clip-copy"><h3>Clip seven</h3></div></article>
            <article class="profile-clip"><a class="clip-thumbnail-link" href="#clip-8" aria-label="Play clip eight"><span class="clip-thumbnail-placeholder"><span>8</span></span></a><div class="profile-clip-copy"><h3>Clip eight</h3></div></article>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
